<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details | Myntra</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
    <a href="index.html" class="logo">MYNTRA</a>
    <nav>
        <a href="index.html">HOME</a>
        <a href="men.html">MEN</a>
        <a href="women.html">WOMEN</a>
    </nav>
</header>

<section class="section">
    <div class="product-detail">
        <img id="productImage" src="" alt="Selected product">

        <div class="product-info">
            <p class="pink-text">MYNTRA COLLECTION</p>
            <h1 id="productName">Product Name</h1>
            <p id="productDescription">Product description</p>
            <p class="price" id="productPrice">₹0</p>
            <p>Inclusive of all applicable taxes.</p>

            <button class="button" onclick="addToBag()">
                ADD TO BAG
            </button>

            <p id="message"></p>
            <a href="index.html" class="back-link">
                ← Continue Shopping
            </a>
        </div>
    </div>
</section>

<footer>
    <p>MYNTRA FASHION STORE</p>
    <p>HTML & CSS Academic Project</p>
</footer>

<script>
const products = {
    tshirt: {
        name: "Casual T-Shirt",
        description: "A comfortable everyday wardrobe essential.",
        price: "₹699",
        image: "https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=600&q=80"
    },
    shoes: {
        name: "Sporty Sneakers",
        description: "Sport-inspired footwear for casual looks.",
        price: "₹1,499",
        image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=600&q=80"
    },
    bag: {
        name: "Classic Handbag",
        description: "A versatile accessory for everyday styling.",
        price: "₹999",
        image: "https://images.unsplash.com/photo-1548036328-c9fa89d128fa?auto=format&fit=crop&w=600&q=80"
    },
    outfit: {
        name: "Fashion Outfit",
        description: "A contemporary look for your wardrobe.",
        price: "₹1,299",
        image: "https://images.unsplash.com/photo-1529139574466-a303027c1d8b?auto=format&fit=crop&w=600&q=80"
    },
    beauty: {
        name: "Beauty Essentials",
        description: "Explore everyday personal care essentials.",
        price: "₹499",
        image: "https://images.unsplash.com/photo-1596462502278-27bfdc403348?auto=format&fit=crop&w=600&q=80"
    }
};

const item = new URLSearchParams(window.location.search)
    .get("item") || "tshirt";

const product = products[item] || products.tshirt;

document.getElementById("productName").textContent = product.name;
document.getElementById("productDescription").textContent = product.description;
document.getElementById("productPrice").textContent = product.price;
document.getElementById("productImage").src = product.image;
document.getElementById("productImage").alt = product.name;

function addToBag() {
    document.getElementById("message").textContent =
        "Demo: " + product.name + " selected!";
}
</script>

</body>
</html>
